<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ hoạt động – Xuất kho vật tư</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Times New Roman", serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="720" height="950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- OUTER BORDER -->
  <rect x="5" y="5" width="710" height="940" fill="white" stroke="#000" stroke-width="1.5"/>

  <!-- SWIMLANE HEADERS -->
  <rect x="5" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <rect x="360" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <text x="182" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Nhân viên Kho</text>
  <text x="537" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Hệ thống</text>

  <!-- LANE DIVIDER -->
  <line x1="360" y1="47" x2="360" y2="945" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- START -->
  <circle cx="182" cy="78" r="13" fill="#000"/>
  <line x1="182" y1="91" x2="182" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U1 -->
  <rect x="55" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn menu "Quản lý kho" -> "Xuất kho"</text>
  <line x1="310" y1="131" x2="398" y2="131" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S1 -->
  <rect x="400" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị DS phiếu yêu cầu xuất kho</text>
  <line x1="527" y1="150" x2="527" y2="170" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="170" x2="310" y2="170" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U2 -->
  <rect x="55" y="173" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="197" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn phiếu yêu cầu từ Kỹ thuật</text>
  <line x1="310" y1="194" x2="398" y2="194" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2 -->
  <rect x="400" y="175" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="199" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị chi tiết vật tư &amp; SL tồn kho</text>
  <line x1="527" y1="213" x2="527" y2="235" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="235" x2="310" y2="235" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U3 -->
  <rect x="55" y="238" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="262" text-anchor="middle" font-size="12" font-family="Times New Roman">Kiểm tra vật tư thực tế và nhấn "Xác nhận"</text>
  <line x1="310" y1="257" x2="398" y2="257" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S3: Check tồn -->
  <rect x="400" y="238" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="262" text-anchor="middle" font-size="12" font-family="Times New Roman">Hệ thống kiểm tra số lượng tồn kho</text>
  <line x1="527" y1="276" x2="527" y2="295" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D1: Đủ hàng? -->
  <polygon points="527,295 615,323 527,351 439,323" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="319" text-anchor="middle" font-size="11" font-family="Times New Roman">Đủ hàng</text>
  <text x="527" y="333" text-anchor="middle" font-size="11" font-family="Times New Roman">trong kho?</text>

  <!-- [no] → error → LEFT -->
  <line x1="439" y1="323" x2="310" y2="323" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="316" text-anchor="middle" font-size="10" font-family="Times New Roman">[no]</text>
  <rect x="130" y="304" width="180" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="220" y="324" text-anchor="middle" font-size="10" font-family="Times New Roman">Cảnh báo: "Không đủ vật tư"</text>
  <text x="220" y="338" text-anchor="middle" font-size="10" font-family="Times New Roman">Yêu cầu nhập thêm hàng</text>
  
  <line x1="130" y1="323" x2="100" y2="323" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="82" cy="323" r="10" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="323" r="6" fill="#000"/>

  <!-- [yes] → down -->
  <line x1="527" y1="351" x2="527" y2="370" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="365" font-size="10" font-family="Times New Roman">[yes]</text>

  <!-- S4: Trừ tồn -->
  <rect x="400" y="372" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="396" text-anchor="middle" font-size="12" font-family="Times New Roman">Trừ (-) số lượng vào bảng Inventory</text>
  <line x1="527" y1="410" x2="527" y2="429" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S5: Lưu phiếu -->
  <rect x="400" y="431" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="455" text-anchor="middle" font-size="12" font-family="Times New Roman">Lưu phiếu xuất kho vào CSDL</text>
  <line x1="527" y1="469" x2="527" y2="488" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S6: Log -->
  <rect x="400" y="490" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="514" text-anchor="middle" font-size="12" font-family="Times New Roman">Ghi log hành động xuất kho</text>
  <line x1="527" y1="528" x2="527" y2="547" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S7: Thông báo & In -->
  <rect x="400" y="549" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="573" text-anchor="middle" font-size="12" font-family="Times New Roman">Thông báo thành công &amp; xuất file PDF</text>
  <line x1="527" y1="587" x2="527" y2="606" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="527" cy="620" r="13" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="527" cy="620" r="8" fill="#000"/>
</svg>

<p style="text-align:center; font-style:italic; font-family:'Times New Roman'; font-size:13px; margin-top:4px;">
  Hình 2.u. Biểu đồ hoạt động use case Xuất kho vật tư
</p>
</body>
</html>
