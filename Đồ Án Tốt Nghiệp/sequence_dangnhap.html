<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Bieu do trinh tu – Dang nhap (Chuan)</title>
  <style>
    body { margin:0; background:#fff; font-family:"Arial",sans-serif; }
    svg  { display:block; margin:20px auto; }
  </style>
</head>
<body>
<svg width="900" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a52a2a"/>
    </marker>
    <marker id="da" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#a52a2a" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ── ACTOR: NguoiDung  cx=80 ── -->
  <g transform="translate(60,30)">
    <circle cx="20" cy="15" r="8" fill="none" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="23" x2="20" y2="40" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="5"  y1="30" x2="35" y2="30" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="10" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="30" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <text x="20" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: NguoiDung</text>
  </g>

  <!-- ── BOUNDARY: DangNhapUI  cx=245 ── -->
  <g transform="translate(200,40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: DangNhapUI</text>
  </g>

  <!-- ── CONTROLLER: DangNhapController  cx=425 ── -->
  <g transform="translate(380,40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <path d="M35,5 Q45,-5 55,5" fill="none" stroke="#000" stroke-width="1.5"/>
    <polygon points="55,5 50,5 55,10" fill="#000"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: DangNhapController</text>
  </g>

  <!-- ── ENTITY: TaiKhoan  cx=605 ── -->
  <g transform="translate(560,40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <line x1="20" y1="50" x2="70" y2="50" stroke="#000" stroke-width="1.5"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: TaiKhoan</text>
  </g>

  <!-- ── BOUNDARY: IHeThongCSDL  cx=775 ── -->
  <g transform="translate(730,40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: IHeThongCSDL</text>
  </g>

  <!-- LIFELINES -->
  <line x1="80"  y1="130" x2="80"  y2="860" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="245" y1="130" x2="245" y2="860" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="425" y1="130" x2="425" y2="860" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="605" y1="130" x2="605" y2="860" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="775" y1="130" x2="775" y2="860" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="75"  y="142" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="142" width="10" height="60"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="75"  y="220" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="220" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="75"  y="270" width="10" height="38"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="270" width="10" height="38"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="324" width="10" height="42"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="420" y="350" width="10" height="290" fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="770" y="382" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="600" y="420" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="660" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="420" y="700" width="10" height="80"  fill="#ffe6e6" stroke="#a52a2a"/>

  <!-- MESSAGES -->
  <!-- 1 -->
  <line x1="85" y1="148" x2="240" y2="148" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="143" text-anchor="middle" font-size="10">1: truyCapTrangDangNhap()</text>

  <!-- 2 self UI -->
  <path d="M250,158 L282,158 L282,178 L250,178" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="338" y="173" text-anchor="middle" font-size="10">2: hienThiFormDangNhap()</text>

  <!-- 3 -->
  <line x1="85" y1="226" x2="240" y2="226" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="221" text-anchor="middle" font-size="10">3: nhapEmailVaMatKhau()</text>

  <!-- 4 -->
  <line x1="85" y1="276" x2="240" y2="276" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="271" text-anchor="middle" font-size="10">4: nhanNutDangNhap()</text>

  <!-- 5 UI→Ctrl -->
  <line x1="250" y1="330" x2="420" y2="330" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="325" text-anchor="middle" font-size="10">5: kiemTraDuLieuDauVao(email, matKhau)</text>

  <!-- ALT block -->
  <rect x="30" y="340" width="840" height="78" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="360" x2="78" y2="360" stroke="#000" stroke-width="1"/>
  <line x1="78" y1="360" x2="88" y2="340" stroke="#000" stroke-width="1"/>
  <text x="54" y="356" font-size="11" font-weight="bold">alt</text>
  <text x="96" y="356" font-size="10" font-style="italic">[Du lieu khong hop le – thieu thong tin]</text>
  <line x1="420" y1="376" x2="80" y2="376" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="250" y="371" text-anchor="middle" font-size="10">5a: hienThiLoiNhapThieu()</text>
  <line x1="30" y1="388" x2="870" y2="388" stroke="#000" stroke-width="0.8" stroke-dasharray="8,4"/>
  <text x="96" y="404" font-size="10" font-style="italic">[Du lieu hop le]</text>

  <!-- 6 Ctrl→DB -->
  <line x1="430" y1="416" x2="770" y2="416" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="600" y="411" text-anchor="middle" font-size="10">6: truyVanTaiKhoan(email)</text>

  <!-- 7 Ctrl→TaiKhoan -->
  <line x1="430" y1="448" x2="600" y2="448" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="515" y="443" text-anchor="middle" font-size="10">7: getAccountInfo(email)</text>

  <!-- 8 return hashPassword -->
  <line x1="600" y1="470" x2="430" y2="470" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="515" y="465" text-anchor="middle" font-size="10">8: returnAccountInfo(hashPassword)</text>

  <!-- ALT2 -->
  <rect x="30" y="482" width="840" height="158" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="500" x2="78" y2="500" stroke="#000" stroke-width="1"/>
  <line x1="78" y1="500" x2="88" y2="482" stroke="#000" stroke-width="1"/>
  <text x="54" y="496" font-size="11" font-weight="bold">alt</text>
  <text x="96" y="496" font-size="10" font-style="italic">[Tai khoan khong ton tai]</text>
  <line x1="420" y1="516" x2="80" y2="516" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="250" y="511" text-anchor="middle" font-size="10">9a: hienThiLoiKhongTimThayTaiKhoan()</text>
  <line x1="30" y1="528" x2="870" y2="528" stroke="#000" stroke-width="0.8" stroke-dasharray="8,4"/>
  <text x="96" y="544" font-size="10" font-style="italic">[Tai khoan ton tai – sai mat khau]</text>
  <line x1="420" y1="558" x2="80" y2="558" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="250" y="553" text-anchor="middle" font-size="10">9b: hienThiLoiSaiMatKhau()</text>
  <line x1="30" y1="570" x2="870" y2="570" stroke="#000" stroke-width="0.8" stroke-dasharray="8,4"/>
  <text x="96" y="586" font-size="10" font-style="italic">[Tai khoan ton tai – mat khau dung]</text>
  <!-- 9 continue -->
  <line x1="430" y1="600" x2="245" y2="600" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="337" y="595" text-anchor="middle" font-size="10">9: taoJWTTokenVaPhienLamViec(userId)</text>

  <!-- 10 ghi log -->
  <line x1="430" y1="640" x2="770" y2="640" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="600" y="635" text-anchor="middle" font-size="10">10: ghiNhanLichSuDangNhap(userId)</text>

  <!-- 11 return success + redirect -->
  <line x1="420" y1="668" x2="245" y2="668" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="332" y="663" text-anchor="middle" font-size="10">11: returnToken + dieuHuongDashboard()</text>

  <!-- 12 self UI -->
  <path d="M250,706 L282,706 L282,726 L250,726" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="344" y="721" text-anchor="middle" font-size="10">12: hienThiDashboardVaThongBaoThanhCong()</text>

</svg>

<p style="text-align:center; font-style:italic; font-family:'Arial'; font-size:14px; margin-top:10px;">
  Hình 2.x. Biểu đồ trình tự use case Đăng nhập
</p>

</html>
