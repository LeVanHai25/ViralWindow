<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Bảng CSDL – Nhóm Kinh doanh</title>
  <style>body{margin:20px;background:#fff;font-family:Arial,sans-serif}svg{display:block;margin:15px auto}</style>
</head>
<body>

<!-- BẢNG 4: projects -->
<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold">Bảng 2.4. projects – Dự án</text>
  <rect x="20" y="35" width="660" height="30" fill="#d4a373" stroke="#a52a2a" stroke-width="1"/>
  <text x="45" y="55" font-size="11" font-weight="bold" fill="#fff">STT</text>
  <text x="85" y="55" font-size="11" font-weight="bold" fill="#fff">Tên cột</text>
  <text x="230" y="55" font-size="11" font-weight="bold" fill="#fff">Kiểu dữ liệu</text>
  <text x="390" y="55" font-size="11" font-weight="bold" fill="#fff">Ràng buộc</text>
  <text x="510" y="55" font-size="11" font-weight="bold" fill="#fff">Mô tả</text>
  <g font-size="11">
    <rect x="20" y="65" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="81">1</text><text x="85" y="81" font-weight="bold">id</text><text x="230" y="81">INT</text><text x="390" y="81">PK</text><text x="510" y="81">Mã dự án</text>
    <rect x="20" y="87" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="103">2</text><text x="85" y="103">project_code</text><text x="230" y="103">VARCHAR(50)</text><text x="390" y="103">NOT NULL, UQ</text><text x="510" y="103">Mã dự án (tự sinh)</text>
    <rect x="20" y="109" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="125">3</text><text x="85" y="125">project_name</text><text x="230" y="125">VARCHAR(255)</text><text x="390" y="125">NOT NULL</text><text x="510" y="125">Tên dự án</text>
    <rect x="20" y="131" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="147">4</text><text x="85" y="147">customer_id</text><text x="230" y="147">INT</text><text x="390" y="147">FK → customers(id)</text><text x="510" y="147">Mã khách hàng</text>
    <rect x="20" y="153" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="169">5</text><text x="85" y="169">address</text><text x="230" y="169">TEXT</text><text x="390" y="169"></text><text x="510" y="169">Địa chỉ thi công</text>
    <rect x="20" y="175" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="191">6</text><text x="85" y="191">status</text><text x="230" y="191">VARCHAR(50)</text><text x="390" y="191">DEFAULT 'new'</text><text x="510" y="191">Trạng thái dự án</text>
    <rect x="20" y="197" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="213">7</text><text x="85" y="213">start_date</text><text x="230" y="213">DATE</text><text x="390" y="213"></text><text x="510" y="213">Ngày bắt đầu</text>
    <rect x="20" y="219" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="235">8</text><text x="85" y="235">end_date</text><text x="230" y="235">DATE</text><text x="390" y="235"></text><text x="510" y="235">Ngày kết thúc dự kiến</text>
    <rect x="20" y="241" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="257">9</text><text x="85" y="257">total_value</text><text x="230" y="257">DECIMAL(15,2)</text><text x="390" y="257">DEFAULT 0.00</text><text x="510" y="257">Tổng giá trị</text>
    <rect x="20" y="263" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="279">10</text><text x="85" y="279">deposit_amount</text><text x="230" y="279">DECIMAL(15,2)</text><text x="390" y="279">DEFAULT 0.00</text><text x="510" y="279">Tiền đặt cọc</text>
    <rect x="20" y="285" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="301">11</text><text x="85" y="301">agency_id</text><text x="230" y="301">INT</text><text x="390" y="301">FK → agencies(id)</text><text x="510" y="301">Mã đại lý</text>
    <rect x="20" y="307" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="323">12</text><text x="85" y="323">notes</text><text x="230" y="323">TEXT</text><text x="390" y="323"></text><text x="510" y="323">Ghi chú</text>
    <rect x="20" y="329" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="345">13</text><text x="85" y="345">created_by</text><text x="230" y="345">INT</text><text x="390" y="345">FK → users(id)</text><text x="510" y="345">Người tạo</text>
    <rect x="20" y="351" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="367">14</text><text x="85" y="367">created_at</text><text x="230" y="367">TIMESTAMP</text><text x="390" y="367">CURRENT_TIMESTAMP</text><text x="510" y="367">Ngày tạo</text>
    <rect x="20" y="373" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="389">15</text><text x="85" y="389">updated_at</text><text x="230" y="389">TIMESTAMP</text><text x="390" y="389">ON UPDATE</text><text x="510" y="389">Ngày cập nhật</text>
  </g>
</svg>

<!-- BẢNG 5: quotations -->
<svg width="700" height="470" xmlns="http://www.w3.org/2000/svg">
  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold">Bảng 2.5. quotations – Báo giá</text>
  <rect x="20" y="35" width="660" height="30" fill="#d4a373" stroke="#a52a2a" stroke-width="1"/>
  <text x="45" y="55" font-size="11" font-weight="bold" fill="#fff">STT</text>
  <text x="85" y="55" font-size="11" font-weight="bold" fill="#fff">Tên cột</text>
  <text x="230" y="55" font-size="11" font-weight="bold" fill="#fff">Kiểu dữ liệu</text>
  <text x="390" y="55" font-size="11" font-weight="bold" fill="#fff">Ràng buộc</text>
  <text x="510" y="55" font-size="11" font-weight="bold" fill="#fff">Mô tả</text>
  <g font-size="11">
    <rect x="20" y="65" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="81">1</text><text x="85" y="81" font-weight="bold">id</text><text x="230" y="81">INT</text><text x="390" y="81">PK</text><text x="510" y="81">Mã báo giá</text>
    <rect x="20" y="87" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="103">2</text><text x="85" y="103">quotation_code</text><text x="230" y="103">VARCHAR(50)</text><text x="390" y="103">NOT NULL, UQ</text><text x="510" y="103">Mã báo giá (tự sinh)</text>
    <rect x="20" y="109" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="125">3</text><text x="85" y="125">project_id</text><text x="230" y="125">INT</text><text x="390" y="125">FK → projects(id)</text><text x="510" y="125">Mã dự án</text>
    <rect x="20" y="131" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="147">4</text><text x="85" y="147">customer_id</text><text x="230" y="147">INT</text><text x="390" y="147">FK → customers(id)</text><text x="510" y="147">Mã khách hàng</text>
    <rect x="20" y="153" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="169">5</text><text x="85" y="169">quotation_date</text><text x="230" y="169">DATE</text><text x="390" y="169">NOT NULL</text><text x="510" y="169">Ngày lập báo giá</text>
    <rect x="20" y="175" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="191">6</text><text x="85" y="191">validity_days</text><text x="230" y="191">INT</text><text x="390" y="191">DEFAULT 30</text><text x="510" y="191">Số ngày hiệu lực</text>
    <rect x="20" y="197" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="213">7</text><text x="85" y="213">status</text><text x="230" y="213">VARCHAR(50)</text><text x="390" y="213">DEFAULT 'draft'</text><text x="510" y="213">Trạng thái</text>
    <rect x="20" y="219" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="235">8</text><text x="85" y="235">subtotal</text><text x="230" y="235">DECIMAL(15,2)</text><text x="390" y="235">DEFAULT 0.00</text><text x="510" y="235">Tạm tính</text>
    <rect x="20" y="241" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="257">9</text><text x="85" y="257">profit_margin_%</text><text x="230" y="257">DECIMAL(5,2)</text><text x="390" y="257">DEFAULT 20.00</text><text x="510" y="257">% lợi nhuận</text>
    <rect x="20" y="263" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="279">10</text><text x="85" y="279">total_amount</text><text x="230" y="279">DECIMAL(15,2)</text><text x="390" y="279">DEFAULT 0.00</text><text x="510" y="279">Tổng tiền</text>
    <rect x="20" y="285" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="301">11</text><text x="85" y="301">vat_percent</text><text x="230" y="301">DECIMAL(5,2)</text><text x="390" y="301">DEFAULT 10.00</text><text x="510" y="301">% VAT</text>
    <rect x="20" y="307" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="323">12</text><text x="85" y="323">discount_percent</text><text x="230" y="323">DECIMAL(5,2)</text><text x="390" y="323">DEFAULT 0.00</text><text x="510" y="323">% chiết khấu</text>
    <rect x="20" y="329" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="345">13</text><text x="85" y="345">advance_amount</text><text x="230" y="345">DECIMAL(15,2)</text><text x="390" y="345">DEFAULT 0.00</text><text x="510" y="345">Tiền đặt cọc</text>
    <rect x="20" y="351" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="367">14</text><text x="85" y="367">deposit_paid</text><text x="230" y="367">TINYINT(1)</text><text x="390" y="367">DEFAULT 0</text><text x="510" y="367">Đã thanh toán cọc</text>
    <rect x="20" y="373" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="389">15</text><text x="85" y="389">notes</text><text x="230" y="389">TEXT</text><text x="390" y="389"></text><text x="510" y="389">Ghi chú</text>
    <rect x="20" y="395" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="411">16</text><text x="85" y="411">created_by</text><text x="230" y="411">INT</text><text x="390" y="411">FK → users(id)</text><text x="510" y="411">Người tạo</text>
    <rect x="20" y="417" width="660" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="433">17</text><text x="85" y="433">created_at</text><text x="230" y="433">TIMESTAMP</text><text x="390" y="433">CURRENT_TIMESTAMP</text><text x="510" y="433">Ngày tạo</text>
    <rect x="20" y="439" width="660" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="455">18</text><text x="85" y="455">updated_at</text><text x="230" y="455">TIMESTAMP</text><text x="390" y="455">ON UPDATE</text><text x="510" y="455">Ngày cập nhật</text>
  </g>
</svg>

</body>
</html>
