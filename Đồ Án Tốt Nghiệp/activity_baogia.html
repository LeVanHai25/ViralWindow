<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ hoạt động – Lập báo giá</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Times New Roman", serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="760" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- OUTER BORDER -->
  <rect x="5" y="5" width="750" height="990" fill="white" stroke="#000" stroke-width="1.5"/>

  <!-- SWIMLANE HEADERS -->
  <rect x="5"   y="5" width="375" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <rect x="380" y="5" width="375" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <text x="192" y="31" text-anchor="middle" font-size="14" font-weight="bold" font-family="Times New Roman">Nhân viên kinh doanh / Quản lý</text>
  <text x="567" y="31" text-anchor="middle" font-size="14" font-weight="bold" font-family="Times New Roman">Hệ thống</text>

  <!-- LANE DIVIDER -->
  <line x1="380" y1="47" x2="380" y2="995" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- START -->
  <circle cx="192" cy="70" r="11" fill="#000"/>
  <line x1="192" y1="81" x2="192" y2="100" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- U1: Nhấn Tạo báo giá -->
  <rect x="60" y="100" width="260" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="190" y="120" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn menu & nhấn "Tạo báo giá mới"</text>
  <line x1="320" y1="116" x2="422" y2="116" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- S1: Form -->
  <rect x="422" y="100" width="280" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="120" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị form lập báo giá</text>
  <line x1="562" y1="132" x2="562" y2="150" stroke="#000" stroke-width="1.2"/>
  <line x1="562" y1="150" x2="310" y2="150" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- U2: Chọn KH -->
  <rect x="60" y="134" width="250" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="185" y="154" text-anchor="middle" font-size="12" font-family="Times New Roman">Tìm kiếm và chọn khách hàng</text>
  <line x1="185" y1="166" x2="185" y2="185" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- U3: Thêm SP -->
  <rect x="40" y="185" width="300" height="40" rx="8" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="190" y="202" text-anchor="middle" font-size="11" font-family="Times New Roman">Thêm bộ cửa: Hệ nhôm, Mã SP,</text>
  <text x="190" y="218" text-anchor="middle" font-size="11" font-family="Times New Roman">nhập kích thước (R x C) & số lượng</text>
  <line x1="340" y1="205" x2="422" y2="205" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- S2: Check Price -->
  <rect x="422" y="185" width="280" height="40" rx="20" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="202" text-anchor="middle" font-size="12" font-family="Times New Roman">Tra cứu đơn giá &</text>
  <text x="562" y="218" text-anchor="middle" font-size="12" font-family="Times New Roman">kiểm tra loại sản phẩm</text>
  <line x1="562" y1="225" x2="562" y2="245" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- D1: Có đơn giá? -->
  <polygon points="562,245 640,275 562,305 484,275" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="271" text-anchor="middle" font-size="11" font-family="Times New Roman">Có đơn giá</text>
  <text x="562" y="285" text-anchor="middle" font-size="11" font-family="Times New Roman">cố định?</text>

  <!-- [no] Branch -->
  <line x1="484" y1="275" x2="320" y2="275" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="400" y="270" text-anchor="middle" font-size="10" font-family="Times New Roman" font-style="italic">[no]</text>
  <rect x="60" y="255" width="260" height="40" rx="6" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="190" y="273" text-anchor="middle" font-size="11" font-family="Times New Roman">Nhập đơn giá thủ công</text>
  <text x="190" y="287" text-anchor="middle" font-size="10" font-family="Times New Roman" font-style="italic">(Cần Quản lý phê duyệt)</text>
  <line x1="190" y1="295" x2="190" y2="325" stroke="#000" stroke-width="1.2"/>
  <line x1="190" y1="325" x2="422" y2="325" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- [yes] Branch -->
  <line x1="562" y1="305" x2="562" y2="325" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="575" y="315" text-anchor="middle" font-size="10" font-family="Times New Roman" font-style="italic">[yes]</text>

  <!-- S3: Calculate -->
  <rect x="422" y="325" width="280" height="40" rx="8" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="342" text-anchor="middle" font-size="12" font-family="Times New Roman">Tính diện tích (m2) &</text>
  <text x="562" y="358" text-anchor="middle" font-size="12" font-family="Times New Roman">tính thành tiền các mục</text>
  
  <!-- Loop-back: Tiếp tục thêm SP (SOLID LINE) -->
  <line x1="702" y1="345" x2="745" y2="345" stroke="#000" stroke-width="1.2"/>
  <line x1="745" y1="345" x2="745" y2="205" stroke="#000" stroke-width="1.2"/>
  <line x1="745" y1="205" x2="345" y2="205" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="732" y="275" text-anchor="middle" font-size="9" transform="rotate(-90,732,275)">Tiếp tục thêm SP</text>

  <!-- Continue flow -->
  <line x1="562" y1="365" x2="562" y2="385" stroke="#000" stroke-width="1.2"/>
  <line x1="562" y1="385" x2="310" y2="385" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- U4: Discount/VAT -->
  <rect x="60" y="369" width="250" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="185" y="389" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhập tỷ lệ chiết khấu, Thuế VAT</text>
  <line x1="185" y1="401" x2="185" y2="425" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- U-Save: Nhấn Lưu -->
  <rect x="60" y="425" width="250" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="185" y="445" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhấn "Lưu & Xuất báo giá"</text>
  <line x1="310" y1="441" x2="422" y2="441" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- S4: Update total & Save -->
  <rect x="422" y="425" width="298" height="40" rx="8" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="571" y="442" text-anchor="middle" font-size="12" font-family="Times New Roman">Cập nhật Tổng giá trị,</text>
  <text x="571" y="458" text-anchor="middle" font-size="12" font-family="Times New Roman">lưu vào bảng Quotations</text>
  <line x1="571" y1="465" x2="571" y2="490" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- S5: Create PDF -->
  <rect x="422" y="490" width="280" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="510" text-anchor="middle" font-size="12" font-family="Times New Roman">Khởi tạo file PDF báo giá theo mẫu</text>
  <line x1="562" y1="522" x2="562" y2="550" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- D2: PDF OK? -->
  <polygon points="562,550 640,580 562,610 484,580" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="576" text-anchor="middle" font-size="11" font-family="Times New Roman">Thành công?</text>

  <!-- [no] Branch: Lỗi kết nối -->
  <line x1="640" y1="580" x2="720" y2="580" stroke="#000" stroke-width="1.2"/>
  <line x1="720" y1="580" x2="720" y2="615" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="680" y="575" text-anchor="middle" font-size="10" font-family="Times New Roman" font-style="italic">[no]</text>
  <rect x="580" y="615" width="160" height="40" rx="8" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="660" y="635" text-anchor="middle" font-size="11" font-family="Times New Roman">Thông báo lỗi,</text>
  <text x="660" y="649" text-anchor="middle" font-size="11" font-family="Times New Roman">cho phép "Tải lại file"</text>
  <!-- Link back to S5 (SOLID LINE) -->
  <line x1="740" y1="635" x2="755" y2="635" stroke="#000" stroke-width="1.2"/>
  <line x1="755" y1="635" x2="755" y2="506" stroke="#000" stroke-width="1.2"/>
  <line x1="755" y1="506" x2="702" y2="506" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- [yes] Branch -->
  <line x1="562" y1="610" x2="562" y2="650" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="575" y="630" text-anchor="middle" font-size="10" font-family="Times New Roman" font-style="italic">[yes]</text>

  <!-- S6: Success Notify -->
  <rect x="422" y="650" width="280" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="562" y="670" text-anchor="middle" font-size="12" font-family="Times New Roman">Thông báo Lưu báo giá thành công</text>
  <line x1="562" y1="682" x2="562" y2="705" stroke="#000" stroke-width="1.2"/>
  <line x1="562" y1="705" x2="310" y2="705" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- U5: Extension points -->
  <rect x="60" y="689" width="250" height="32" rx="16" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="185" y="709" text-anchor="middle" font-size="12" font-family="Times New Roman">Tùy chọn: Gửi Email / Zalo</text>
  <line x1="185" y1="721" x2="185" y2="750" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="185" cy="770" r="11" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="185" cy="770" r="7" fill="#000"/>

</svg>

<p style="text-align:center; font-style:italic; font-family:'Times New Roman'; font-size:13px; margin-top:2px;">
  Hình 2.x. Biểu đồ hoạt động use case Lập báo giá
</p>
</body>
</html>
