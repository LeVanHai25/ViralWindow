<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ hoạt động – Bóc tách vật tư</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Times New Roman", serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="720" height="1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- OUTER BORDER -->
  <rect x="5" y="5" width="710" height="1170" fill="white" stroke="#000" stroke-width="1.5"/>

  <!-- SWIMLANE HEADERS -->
  <rect x="5" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <rect x="360" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <text x="182" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Nhân viên Kỹ thuật</text>
  <text x="537" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Hệ thống</text>

  <!-- LANE DIVIDER -->
  <line x1="360" y1="47" x2="360" y2="1175" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ═══ NODES ═══ -->

  <!-- START -->
  <circle cx="182" cy="78" r="13" fill="#000"/>
  <line x1="182" y1="91" x2="182" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U1: Chọn menu -->
  <rect x="55" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn menu "Thiết kế &amp; Bóc tách"</text>
  <line x1="310" y1="131" x2="398" y2="131" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S1: Hiển thị DS Dự án -->
  <rect x="400" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị danh sách dự án</text>
  <line x1="527" y1="150" x2="527" y2="172" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="172" x2="310" y2="172" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U2: Chọn DA & SP -->
  <rect x="55" y="175" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="199" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn dự án và nhập Kích thước cửa</text>
  <line x1="182" y1="213" x2="182" y2="232" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U3: Bóc tách -->
  <rect x="55" y="234" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="258" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhấn "Tính toán bóc tách"</text>
  <line x1="310" y1="253" x2="398" y2="253" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2: Kiểm tra công thức -->
  <rect x="400" y="234" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="258" text-anchor="middle" font-size="12" font-family="Times New Roman">Truy xuất công thức cắt hệ nhôm</text>
  <line x1="527" y1="272" x2="527" y2="290" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D1: Tồn tại công thức? -->
  <polygon points="527,290 615,318 527,346 439,318" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="314" text-anchor="middle" font-size="11" font-family="Times New Roman">Công thức</text>
  <text x="527" y="328" text-anchor="middle" font-size="11" font-family="Times New Roman">tồn tại?</text>

  <!-- [not found] → error → LEFT -->
  <line x1="439" y1="318" x2="310" y2="318" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="311" text-anchor="middle" font-size="10" font-family="Times New Roman">[not found]</text>
  <rect x="140" y="298" width="170" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="225" y="318" text-anchor="middle" font-size="10" font-family="Times New Roman">Hiển thị lỗi:</text>
  <text x="225" y="332" text-anchor="middle" font-size="10" font-family="Times New Roman">"Không tìm thấy công thức"</text>
  
  <!-- End Error Loop (yêu cầu cấu hình lại) -->
  <line x1="140" y1="317" x2="100" y2="317" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="82" cy="317" r="10" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="317" r="6" fill="#000"/>

  <!-- [found] → down -->
  <line x1="527" y1="346" x2="527" y2="365" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="360" font-size="10" font-family="Times New Roman">[found]</text>

  <!-- S3: Tính toán BOM -->
  <rect x="400" y="367" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="391" text-anchor="middle" font-size="12" font-family="Times New Roman">Tính toán BOM (nhôm, kính, phụ kiện)</text>
  <line x1="527" y1="405" x2="527" y2="424" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S4: Đối chiếu kho -->
  <rect x="400" y="426" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="450" text-anchor="middle" font-size="12" font-family="Times New Roman">Đối chiếu số lượng BOM với Tồn kho</text>
  <line x1="527" y1="464" x2="527" y2="483" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D2: Đủ vật tư? -->
  <polygon points="527,483 615,511 527,539 439,511" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="507" text-anchor="middle" font-size="11" font-family="Times New Roman">Đủ vật tư</text>
  <text x="527" y="521" text-anchor="middle" font-size="11" font-family="Times New Roman">trong kho?</text>

  <!-- [no] → Cảnh báo LEFT -->
  <line x1="439" y1="511" x2="310" y2="511" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="504" text-anchor="middle" font-size="10" font-family="Times New Roman">[no]</text>
  <rect x="130" y="492" width="180" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="220" y="512" text-anchor="middle" font-size="10" font-family="Times New Roman">Bôi đỏ vật tư thiếu &amp;</text>
  <text x="220" y="526" text-anchor="middle" font-size="10" font-family="Times New Roman">Gợi ý tạo Yêu cầu mua hàng</text>
  
  <line x1="220" y1="530" x2="220" y2="570" stroke="#000" stroke-width="1.5"/>
  <line x1="220" y1="570" x2="527" y2="570" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- [yes] → down -->
  <line x1="527" y1="539" x2="527" y2="558" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="545" y="552" font-size="10" font-family="Times New Roman">[yes]</text>

  <!-- S5: Hiển thị BOM -->
  <rect x="400" y="580" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="604" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị Bảng kết quả bóc tách</text>
  <line x1="527" y1="618" x2="527" y2="640" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="640" x2="310" y2="640" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U4: Xác nhận lưu -->
  <rect x="55" y="621" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="645" text-anchor="middle" font-size="12" font-family="Times New Roman">Kiểm tra và nhấn "Lưu BOM"</text>
  <line x1="310" y1="640" x2="398" y2="640" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <!-- U4 to S6 arrow tweak (override overlap) -->
  <line x1="182" y1="659" x2="182" y2="685" stroke="#000" stroke-width="1.5"/>
  <line x1="182" y1="685" x2="398" y2="685" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S6: Lưu CSDL -->
  <rect x="400" y="666" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="690" text-anchor="middle" font-size="12" font-family="Times New Roman">Lưu kết quả bóc tách vào CSDL</text>
  <line x1="527" y1="704" x2="527" y2="723" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S7: Cập nhật DA -->
  <rect x="400" y="725" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="749" text-anchor="middle" font-size="12" font-family="Times New Roman">Cập nhật tiến độ dự án</text>
  <line x1="527" y1="763" x2="527" y2="782" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="527" cy="796" r="13" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="527" cy="796" r="8" fill="#000"/>

</svg>

<p style="text-align:center; font-style:italic; font-family:'Times New Roman'; font-size:13px; margin-top:4px;">
  Hình 2.z. Biểu đồ hoạt động use case Thiết kế &amp; Bóc tách vật tư
</p>
</body>
</html>
