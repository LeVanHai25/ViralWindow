<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Bieu do trinh tu – Quan ly kho vat tu (Chuan)</title>
  <style>
    body { margin:0; background:#fff; font-family:"Arial",sans-serif; }
    svg  { display:block; margin:20px auto; }
  </style>
</head>
<body>
<svg width="900" height="1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a52a2a"/>
    </marker>
    <marker id="da" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#a52a2a" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ACTOR: NhanVienKho cx=80 -->
  <g transform="translate(55,30)">
    <circle cx="20" cy="15" r="8" fill="none" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="23" x2="20" y2="40" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="5"  y1="30" x2="35" y2="30" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="10" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="30" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <text x="20" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: NhanVienKho</text>
  </g>

  <!-- BOUNDARY: KhoVatTuUI cx=245 -->
  <g transform="translate(200,40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: KhoVatTuUI</text>
  </g>

  <!-- CONTROLLER: KhoVatTuController cx=425 -->
  <g transform="translate(380,40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <path d="M35,5 Q45,-5 55,5" fill="none" stroke="#000" stroke-width="1.5"/>
    <polygon points="55,5 50,5 55,10" fill="#000"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: KhoVatTuController</text>
  </g>

  <!-- ENTITY: VatTu cx=605 -->
  <g transform="translate(560,40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <line x1="20" y1="50" x2="70" y2="50" stroke="#000" stroke-width="1.5"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: VatTu</text>
  </g>

  <!-- BOUNDARY: IHeThongCSDL cx=775 -->
  <g transform="translate(730,40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: IHeThongCSDL</text>
  </g>

  <!-- LIFELINES -->
  <line x1="75"  y1="130" x2="75"  y2="980" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="245" y1="130" x2="245" y2="980" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="425" y1="130" x2="425" y2="980" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="605" y1="130" x2="605" y2="980" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="775" y1="130" x2="775" y2="980" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="70"  y="142" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="142" width="10" height="78"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="420" y="164" width="10" height="120" fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="600" y="190" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="770" y="226" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="70"  y="390" width="10" height="50"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="390" width="10" height="290" fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="420" y="430" width="10" height="220" fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="770" y="500" width="10" height="50"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="698" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="752" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>

  <!-- MESSAGES -->
  <!-- 1 -->
  <line x1="80" y1="148" x2="240" y2="148" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="143" text-anchor="middle" font-size="10">1: chon "Kho &amp; Vat tu"()</text>

  <!-- 2 UI→Ctrl -->
  <line x1="250" y1="170" x2="420" y2="170" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="165" text-anchor="middle" font-size="10">2: layDuLieuTonKho()</text>

  <!-- 3 Ctrl→VatTu -->
  <line x1="430" y1="196" x2="600" y2="196" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="515" y="191" text-anchor="middle" font-size="10">3: layDanhSachVatTu()</text>

  <!-- 4 VatTu→DB -->
  <line x1="610" y1="234" x2="770" y2="234" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="229" text-anchor="middle" font-size="10">4: SELECT * FROM Materials()</text>

  <!-- 5 return data -->
  <line x1="770" y1="254" x2="610" y2="254" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="690" y="249" text-anchor="middle" font-size="10">5: danhSachVatTu[]</text>

  <!-- 6 Ctrl self: phan tich min/max, gan nhan -->
  <path d="M430,272 L462,272 L462,292 L430,292" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="518" y="287" text-anchor="middle" font-size="10">6: phanTichMinMax() → ganNhan()</text>

  <!-- 7 Ctrl→UI return dashboard -->
  <line x1="420" y1="310" x2="245" y2="310" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="332" y="305" text-anchor="middle" font-size="10">7: returnDashboard(tongMH, canhBao, giaTri)</text>

  <!-- 8 UI self: hien thi -->
  <path d="M250,326 L282,326 L282,346 L250,346" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="354" y="341" text-anchor="middle" font-size="10">8: hienThiDanhSachVatTuVaNhan()</text>

  <!-- 9 -->
  <line x1="80" y1="396" x2="240" y2="396" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="391" text-anchor="middle" font-size="10">9: chonHanhDong (CRUD / TimKiem)</text>

  <!-- OPT: tim kiem -->
  <rect x="30" y="406" width="840" height="56" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="424" x2="78" y2="424" stroke="#000" stroke-width="1"/>
  <line x1="78" y1="424" x2="88" y2="406" stroke="#000" stroke-width="1"/>
  <text x="54" y="420" font-size="11" font-weight="bold">opt</text>
  <text x="96" y="420" font-size="10" font-style="italic">[Tim kiem / Sap xep]</text>
  <line x1="80" y1="442" x2="240" y2="442" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="437" text-anchor="middle" font-size="10">9a: nhapTuKhoa() → hienThiKetQuaPhuHop()</text>

  <!-- 10 -->
  <line x1="80" y1="472" x2="240" y2="472" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="467" text-anchor="middle" font-size="10">10: nhapCapNhatThongTinVatTu(data)</text>

  <!-- 11 UI→Ctrl -->
  <line x1="250" y1="492" x2="420" y2="492" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="487" text-anchor="middle" font-size="10">11: luuCapNhatVatTu(data)</text>

  <!-- ALT: hop le? -->
  <rect x="30" y="502" width="840" height="82" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="520" x2="78" y2="520" stroke="#000" stroke-width="1"/>
  <line x1="78" y1="520" x2="88" y2="502" stroke="#000" stroke-width="1"/>
  <text x="54" y="516" font-size="11" font-weight="bold">alt</text>
  <text x="96" y="516" font-size="10" font-style="italic">[Du lieu khong hop le]</text>
  <line x1="420" y1="536" x2="75" y2="536" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="248" y="531" text-anchor="middle" font-size="10">11a: hienThiLoiDuLieu() [nhap lai]</text>
  <line x1="30" y1="550" x2="870" y2="550" stroke="#000" stroke-width="0.8" stroke-dasharray="8,4"/>
  <text x="96" y="566" font-size="10" font-style="italic">[Du lieu hop le – luu vao CSDL]</text>

  <!-- 12 -->
  <line x1="430" y1="582" x2="770" y2="582" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="600" y="577" text-anchor="middle" font-size="10">12: luuVaoBangMaterials(data)</text>

  <!-- 13 -->
  <line x1="770" y1="602" x2="430" y2="602" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="600" y="597" text-anchor="middle" font-size="10">13: success</text>

  <!-- 14 Ctrl→UI -->
  <line x1="420" y1="656" x2="245" y2="656" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="332" y="651" text-anchor="middle" font-size="10">14: returnKetQua(success)</text>

  <!-- 15 self: thong bao -->
  <path d="M250,702 L282,702 L282,722 L250,722" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="358" y="717" text-anchor="middle" font-size="10">15: hienThiThongBaoLuuThanhCong()</text>

  <!-- 16 self: reload -->
  <path d="M250,756 L282,756 L282,776 L250,776" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="360" y="771" text-anchor="middle" font-size="10">16: taiLaiDanhSachVaThongKeMoiNhat()</text>

  <!-- OPT: Xuat Excel -->
  <rect x="30" y="790" width="840" height="68" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="808" x2="78" y2="808" stroke="#000" stroke-width="1"/>
  <line x1="78" y1="808" x2="88" y2="790" stroke="#000" stroke-width="1"/>
  <text x="54" y="804" font-size="11" font-weight="bold">opt</text>
  <text x="96" y="804" font-size="10" font-style="italic">[Xuat file Excel ton kho]</text>
  <line x1="80" y1="824" x2="240" y2="824" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="819" text-anchor="middle" font-size="10">17: chonXuatExcel()</text>
  <line x1="250" y1="840" x2="420" y2="840" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="835" text-anchor="middle" font-size="10">18: xuatFileExcelTonKho()</text>
  <line x1="420" y1="856" x2="245" y2="856" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="332" y="851" text-anchor="middle" font-size="10">19: returnFileExcel → TaiXuongThanhCong()</text>

</svg>

<p style="text-align:center; font-style:italic; font-family:'Arial'; font-size:14px; margin-top:10px;">
  Hình 2.x. Biểu đồ trình tự use case Quản lý kho vật tư
</p>
</body>
</html>
