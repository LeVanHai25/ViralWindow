<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ hoạt động – Quản lý mẫu sản phẩm</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Times New Roman", serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="720" height="980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- OUTER BORDER -->
  <rect x="5" y="5" width="710" height="970" fill="white" stroke="#000" stroke-width="1.5"/>

  <!-- SWIMLANE HEADERS -->
  <rect x="5" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <rect x="360" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <text x="182" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Nhân viên Kỹ thuật / Admin</text>
  <text x="537" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Hệ thống</text>

  <!-- LANE DIVIDER -->
  <line x1="360" y1="47" x2="360" y2="975" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- START -->
  <circle cx="182" cy="78" r="13" fill="#000"/>
  <line x1="182" y1="91" x2="182" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U1 -->
  <rect x="55" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn menu "Quản lý sản phẩm"</text>
  <line x1="310" y1="131" x2="398" y2="131" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S1 -->
  <rect x="400" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị danh sách các mẫu cửa hiện có</text>
  <line x1="527" y1="150" x2="527" y2="170" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="170" x2="310" y2="170" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U2 -->
  <rect x="55" y="173" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="197" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhấn "Thêm mẫu mới" (hoặc Sửa)</text>
  <line x1="182" y1="211" x2="182" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U3 -->
  <rect x="35" y="232" width="295" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="256" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhập thông tin mẫu &amp; Tải ảnh sơ đồ</text>
  <line x1="182" y1="270" x2="182" y2="289" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U4 -->
  <rect x="35" y="291" width="295" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="315" text-anchor="middle" font-size="12" font-family="Times New Roman">Thiết lập công thức cắt (biến W, H)</text>
  <line x1="182" y1="329" x2="182" y2="348" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U5 -->
  <rect x="55" y="350" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="374" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhấn nút "Lưu cấu hình"</text>
  <line x1="310" y1="369" x2="398" y2="369" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2: Check Formula -->
  <rect x="400" y="350" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="374" text-anchor="middle" font-size="12" font-family="Times New Roman">Hệ thống kiểm tra cú pháp công thức</text>
  <line x1="527" y1="388" x2="527" y2="407" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D1: Hợp lệ? -->
  <polygon points="527,407 615,435 527,463 439,435" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="431" text-anchor="middle" font-size="11" font-family="Times New Roman">Cú pháp</text>
  <text x="527" y="445" text-anchor="middle" font-size="11" font-family="Times New Roman">hợp lệ?</text>

  <!-- [no] → back to U4 -->
  <line x1="615" y1="435" x2="690" y2="435" stroke="#000" stroke-width="1.5"/>
  <text x="648" y="429" text-anchor="middle" font-size="10" font-family="Times New Roman">[no]</text>
  <line x1="690" y1="435" x2="690" y2="310" stroke="#000" stroke-width="1.5"/>
  <line x1="690" y1="310" x2="330" y2="310" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="680" y="380" text-anchor="end" font-size="10" font-family="Times New Roman">[Báo lỗi cú pháp]</text>

  <!-- [yes] → down -->
  <line x1="527" y1="463" x2="527" y2="482" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="477" font-size="10" font-family="Times New Roman">[yes]</text>

  <!-- S3: Lưu DB -->
  <rect x="400" y="484" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="508" text-anchor="middle" font-size="12" font-family="Times New Roman">Lưu vào bảng ProductTemplates &amp; Rules</text>
  <line x1="527" y1="522" x2="527" y2="541" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S4: Log -->
  <rect x="400" y="543" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="567" text-anchor="middle" font-size="12" font-family="Times New Roman">Ghi log cập nhật cấu hình</text>
  <line x1="527" y1="581" x2="527" y2="600" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S5: Thông báo -->
  <rect x="400" y="602" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="626" text-anchor="middle" font-size="12" font-family="Times New Roman">Thông báo "Cấu hình thành công"</text>
  <line x1="527" y1="640" x2="527" y2="659" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="527" cy="673" r="13" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="527" cy="673" r="8" fill="#000"/>
</svg>

<p style="text-align:center; font-style:italic; font-family:'Times New Roman'; font-size:13px; margin-top:4px;">
  Hình 2.u. Biểu đồ hoạt động use case Quản lý mẫu sản phẩm
</p>
</body>
</html>
