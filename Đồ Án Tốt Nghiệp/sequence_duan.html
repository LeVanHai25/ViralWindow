<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Bieu do trinh tu – Quan ly du an (Chuan)</title>
  <style>
    body { margin:0; background:#fff; font-family:"Arial",sans-serif; }
    svg  { display:block; margin:20px auto; }
  </style>
</head>
<body>
<svg width="900" height="880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a52a2a"/>
    </marker>
    <marker id="da" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#a52a2a" stroke-width="1"/>
    </marker>
  </defs>

  <!-- ACTOR: QuanLy cx=80 -->
  <g transform="translate(60,30)">
    <circle cx="20" cy="15" r="8" fill="none" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="23" x2="20" y2="40" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="5"  y1="30" x2="35" y2="30" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="10" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="30" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <text x="20" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: QuanLy</text>
  </g>

  <!-- BOUNDARY: DuAnUI cx=245 -->
  <g transform="translate(200,40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: DuAnUI</text>
  </g>

  <!-- CONTROLLER: DuAnController cx=425 -->
  <g transform="translate(380,40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <path d="M35,5 Q45,-5 55,5" fill="none" stroke="#000" stroke-width="1.5"/>
    <polygon points="55,5 50,5 55,10" fill="#000"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: DuAnController</text>
  </g>

  <!-- ENTITY: DuAn cx=605 -->
  <g transform="translate(560,40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <line x1="20" y1="50" x2="70" y2="50" stroke="#000" stroke-width="1.5"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: DuAn</text>
  </g>

  <!-- BOUNDARY: IHeThongCSDL cx=775 -->
  <g transform="translate(730,40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: IHeThongCSDL</text>
  </g>

  <!-- LIFELINES -->
  <line x1="80"  y1="130" x2="80"  y2="840" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="245" y1="130" x2="245" y2="840" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="425" y1="130" x2="425" y2="840" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="605" y1="130" x2="605" y2="840" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="775" y1="130" x2="775" y2="840" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="75"  y="142" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="142" width="10" height="60"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="75"  y="220" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="220" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="75"  y="266" width="10" height="66"  fill="#ffe6e6" stroke="#a52a2a"/>

  <rect x="240" y="662" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="714" width="10" height="36"  fill="#ffe6e6" stroke="#a52a2a"/>

  <!-- MESSAGES -->
  <!-- 1 -->
  <line x1="85" y1="148" x2="240" y2="148" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="143" text-anchor="middle" font-size="10">1: chon "Quan ly Du An"()</text>

  <!-- 2 self -->
  <path d="M250,158 L282,158 L282,178 L250,178" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="340" y="173" text-anchor="middle" font-size="10">2: hienThiDanhSachDuAnHienCo()</text>

  <!-- 3 -->
  <line x1="85" y1="226" x2="240" y2="226" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="221" text-anchor="middle" font-size="10">3: nhanNutTaoDuAnMoi()</text>

  <!-- 4 self -->
  <path d="M250,236 L282,236 L282,256 L250,256" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="344" y="251" text-anchor="middle" font-size="10">4: hienThiFormThongTinDuAn()</text>

  <!-- 5 -->
  <line x1="85" y1="272" x2="240" y2="272" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="267" text-anchor="middle" font-size="10">5: nhapThongTinDuAn(ten, KH, diaChi)</text>

  <!-- 6 -->
  <line x1="85" y1="302" x2="240" y2="302" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="297" text-anchor="middle" font-size="10">6: nhanNutLuuDuAn()</text>

  <!-- 7 UI→Ctrl -->
  <line x1="250" y1="322" x2="420" y2="322" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="317" text-anchor="middle" font-size="10">7: luuThongTinDuAn(data)</text>

  <!-- 8 Ctrl→DuAn -->
  <line x1="430" y1="354" x2="600" y2="354" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="515" y="349" text-anchor="middle" font-size="10">8: kiemTraTinhHopLeDuLieu(data)</text>

  <!-- ALT -->
  <rect x="30" y="364" width="840" height="78" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="382" x2="78" y2="382" stroke="#000" stroke-width="1"/>
  <line x1="78" y1="382" x2="88" y2="364" stroke="#000" stroke-width="1"/>
  <text x="54" y="378" font-size="11" font-weight="bold">alt</text>
  <text x="96" y="378" font-size="10" font-style="italic">[Du lieu khong hop le – bao loi, nhap lai]</text>
  <line x1="420" y1="398" x2="80" y2="398" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="250" y="393" text-anchor="middle" font-size="10">8a: hienThiLoiDuLieuKhongHopLe() [nhap lai]</text>
  <line x1="30" y1="412" x2="870" y2="412" stroke="#000" stroke-width="0.8" stroke-dasharray="8,4"/>
  <text x="96" y="428" font-size="10" font-style="italic">[Du lieu hop le – tien hanh luu]</text>

  <!-- 9 Ctrl→DB -->
  <line x1="430" y1="444" x2="770" y2="444" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="600" y="439" text-anchor="middle" font-size="10">9: luuVaoBangProjects(data)</text>

  <!-- 10 return success -->
  <line x1="770" y1="464" x2="430" y2="464" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="600" y="459" text-anchor="middle" font-size="10">10: success (projectId)</text>

  <!-- 11 ghi log -->
  <line x1="430" y1="494" x2="770" y2="494" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="600" y="489" text-anchor="middle" font-size="10">11: ghiLogHanhDongTaoDuAn(userId, projectId)</text>

  <!-- 12 return -->
  <line x1="770" y1="514" x2="430" y2="514" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="600" y="509" text-anchor="middle" font-size="10">12: success</text>

  <!-- 13 Ctrl→UI -->
  <line x1="420" y1="608" x2="245" y2="608" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#da)"/>
  <text x="332" y="603" text-anchor="middle" font-size="10">13: returnKetQua(success)</text>

  <!-- 14 self: thong bao -->
  <path d="M250,666 L282,666 L282,686 L250,686" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="354" y="681" text-anchor="middle" font-size="10">14: hienThiThongBaoTaoDuAnThanhCong()</text>

  <!-- 15 self: reload -->
  <path d="M250,718 L282,718 L282,738 L250,738" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="348" y="733" text-anchor="middle" font-size="10">15: taiLaiDanhSachDuAn()</text>

</svg>

<p style="text-align:center; font-style:italic; font-family:'Arial'; font-size:14px; margin-top:10px;">

</p>
