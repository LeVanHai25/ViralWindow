<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ trình tự – Thiết kế & Bóc tách vật tư (Chuẩn Red-Yellow Style)</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Arial", sans-serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="850" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a52a2a"/>
    </marker>
    <marker id="dasharr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#a52a2a" stroke-width="1"/>
    </marker>
  </defs>

  <!-- OBJECTS -->
  <!-- 1. Actor: NhanVienKT -->
  <g transform="translate(60, 30)">
    <circle cx="20" cy="15" r="8" fill="none" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="23" x2="20" y2="40" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="5" y1="30" x2="35" y2="30" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="10" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="30" y2="55" stroke="#a52a2a" stroke-width="1.5"/>
    <text x="20" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: NhanVienKT</text>
  </g>

  <!-- 2. Boundary: ThietKeUI -->
  <g transform="translate(200, 40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: ThietKeUI</text>
  </g>

  <!-- 3. Controller: ThietKeController -->
  <g transform="translate(380, 40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <path d="M35,5 Q45,-5 55,5" fill="none" stroke="#000" stroke-width="1.5"/>
    <polygon points="55,5 50,5 55,10" fill="#000"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: ThietKeController</text>
  </g>

  <!-- 4. Entity: DuAn_BOM -->
  <g transform="translate(560, 40)">
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <line x1="20" y1="50" x2="70" y2="50" stroke="#000" stroke-width="1.5"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: DuAn_BOM</text>
  </g>

  <!-- 5. DB: IHeThongCSDL -->
  <g transform="translate(730, 40)">
    <line x1="10" y1="10" x2="10" y2="40" stroke="#000" stroke-width="1.5"/>
    <line x1="10" y1="25" x2="20" y2="25" stroke="#000" stroke-width="1.5"/>
    <circle cx="45" cy="25" r="25" fill="#fffbe6" stroke="#000" stroke-width="1.2"/>
    <text x="45" y="75" text-anchor="middle" font-size="12" font-weight="bold" text-decoration="underline">: IHeThongCSDL</text>
  </g>

  <!-- LIFELINES -->
  <line x1="80"  y1="130" x2="80"  y2="950" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="245" y1="130" x2="245" y2="950" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="425" y1="130" x2="425" y2="950" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="605" y1="130" x2="605" y2="950" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="775" y1="130" x2="775" y2="950" stroke="#000" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="75"  y="140" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="140" width="10" height="60"  fill="#ffe6e6" stroke="#a52a2a"/>

  <rect x="75"  y="210" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="210" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>

  <rect x="75"  y="260" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="260" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  
  <rect x="75"  y="310" width="10" height="40"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="240" y="310" width="10" height="570" fill="#ffe6e6" stroke="#a52a2a"/>
  
  <rect x="420" y="340" width="10" height="510" fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="600" y="390" width="10" height="90"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="770" y="420" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  
  <rect x="600" y="520" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  <rect x="770" y="520" width="10" height="30"  fill="#ffe6e6" stroke="#a52a2a"/>
  
  <rect x="770" y="590" width="10" height="50"  fill="#ffe6e6" stroke="#a52a2a"/>

  <!-- MESSAGES -->
  
  <!-- 1 -->
  <line x1="85" y1="145" x2="240" y2="145" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="140" text-anchor="middle" font-size="10">1: chon "Thiet ke &amp; Boc tach"</text>
  
  <!-- 2 -->
  <path d="M250,155 L280,155 L280,175 L250,175" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="170" text-anchor="middle" font-size="10">2: hien thi danh sach Du An</text>

  <!-- 3 -->
  <line x1="85" y1="225" x2="240" y2="225" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="220" text-anchor="middle" font-size="10">3: chonDuAn()</text>

  <!-- 4 -->
  <line x1="85" y1="275" x2="240" y2="275" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="270" text-anchor="middle" font-size="10">4: chotKichThuocThucTe()</text>

  <!-- 5 -->
  <line x1="85" y1="325" x2="240" y2="325" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="162" y="320" text-anchor="middle" font-size="10">5: raLenhBocTach()</text>

  <!-- 6 -->
  <line x1="250" y1="355" x2="420" y2="355" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="335" y="350" text-anchor="middle" font-size="10">6: thucHienBocTachBOM()</text>

  <!-- 7 (Self-call calculation) -->
  <path d="M430,365 L460,365 L460,385 L430,385" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="515" y="380" text-anchor="middle" font-size="10">7: tinhToanCongThucCat()</text>

  <!-- 8 -->
  <line x1="430" y1="405" x2="600" y2="405" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="515" y="400" text-anchor="middle" font-size="10">8: taoBanGhiBOM()</text>

  <!-- 9 -->
  <line x1="610" y1="435" x2="770" y2="435" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="430" text-anchor="middle" font-size="10">9: insert BOM data</text>

  <!-- 10 -->
  <line x1="770" y1="465" x2="610" y2="465" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#dasharr)"/>
  <text x="690" y="460" text-anchor="middle" font-size="10">10: return success</text>

  <!-- 11 -->
  <line x1="600" y1="495" x2="430" y2="495" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#dasharr)"/>
  <text x="515" y="490" text-anchor="middle" font-size="10">11: return success</text>

  <!-- 12. Update Status -->
  <line x1="430" y1="535" x2="600" y2="535" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="515" y="530" text-anchor="middle" font-size="10">12: update Trang Thai DA</text>
  
  <line x1="610" y1="535" x2="770" y2="535" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="530" text-anchor="middle" font-size="10">13: update()</text>

  <!-- 14. Check Inventory -->
  <line x1="430" y1="605" x2="770" y2="605" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="600" y="600" text-anchor="middle" font-size="10">14: kiemTraTonKho(BOM_data)</text>

  <!-- 15. Return inventory result -->
  <line x1="770" y1="635" x2="430" y2="635" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#dasharr)"/>
  <text x="600" y="630" text-anchor="middle" font-size="10">15: list thieu_hut</text>

  <!-- ALT Block for Inventory check -->
  <rect x="30" y="660" width="810" height="230" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="30" y1="680" x2="90" y2="680" stroke="#000" stroke-width="1"/>
  <line x1="90" y1="680" x2="100" y2="660" stroke="#000" stroke-width="1"/>
  <text x="55" y="675" font-size="11" font-weight="bold">alt</text>
  
  <text x="45" y="700" font-size="10" font-style="italic">[Thiếu vật tư]</text>

  <!-- 16 -->
  <line x1="420" y1="710" x2="250" y2="710" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#dasharr)"/>
  <text x="335" y="705" text-anchor="middle" font-size="10">16: return canh_bao_thieu</text>

  <!-- 17. Show warning & Request button -->
  <path d="M250,725 L280,725 L280,745 L250,745" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="340" y="740" text-anchor="middle" font-size="10">17: hien thi canh bao &amp; Nut Tao Y/C</text>

  <!-- Divider for ALT -->
  <line x1="30" y1="775" x2="840" y2="775" stroke="#000" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="45" y="795" font-size="10" font-style="italic">[Đủ vật tư]</text>

  <!-- 18 -->
  <line x1="420" y1="810" x2="250" y2="810" stroke="#a52a2a" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#dasharr)"/>
  <text x="335" y="805" text-anchor="middle" font-size="10">18: return hoan_tat_thanh_cong</text>

  <!-- 19 -->
  <path d="M250,830 L280,830 L280,850 L250,850" fill="none" stroke="#a52a2a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="340" y="845" text-anchor="middle" font-size="10">19: hien thi thong bao thanh cong</text>

</svg>

<p style="text-align:center; font-style:italic; font-family:'Arial'; font-size:14px; margin-top:10px;">
  Hình 2.x. Biểu đồ trình tự use case Quản lý kỹ thuật (Thiết kế &amp; Bóc tách)
</p>
</body>
</html>
