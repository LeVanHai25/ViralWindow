<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ hoạt động – Kiểm kê kho</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Times New Roman", serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="720" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- OUTER BORDER -->
  <rect x="5" y="5" width="710" height="990" fill="white" stroke="#000" stroke-width="1.5"/>

  <!-- SWIMLANE HEADERS -->
  <rect x="5" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <rect x="360" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <text x="182" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Nhân viên Kho / Quản lý</text>
  <text x="537" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Hệ thống</text>

  <!-- LANE DIVIDER -->
  <line x1="360" y1="47" x2="360" y2="995" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- START -->
  <circle cx="182" cy="78" r="13" fill="#000"/>
  <line x1="182" y1="91" x2="182" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U1 -->
  <rect x="55" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Chọn menu "Quản lý kho" → "Kiểm kê"</text>
  <line x1="310" y1="131" x2="398" y2="131" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S1 -->
  <rect x="400" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Xuất danh sách vật tư &amp; SL tồn sổ sách</text>
  <line x1="527" y1="150" x2="527" y2="170" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="170" x2="310" y2="170" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U2 -->
  <rect x="55" y="173" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="197" text-anchor="middle" font-size="12" font-family="Times New Roman">Kiểm đếm thực tế và nhập SL thực tế</text>
  <line x1="182" y1="211" x2="182" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U3 -->
  <rect x="55" y="232" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="256" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhấn "Xác nhận kiểm kê"</text>
  <line x1="310" y1="251" x2="398" y2="251" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2: So sánh -->
  <rect x="400" y="232" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="256" text-anchor="middle" font-size="12" font-family="Times New Roman">So sánh SL thực tế và SL sổ sách</text>
  <line x1="527" y1="270" x2="527" y2="289" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D1: Có chênh lệch? -->
  <polygon points="527,289 615,317 527,345 439,317" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="313" text-anchor="middle" font-size="11" font-family="Times New Roman">Có chênh</text>
  <text x="527" y="327" text-anchor="middle" font-size="11" font-family="Times New Roman">lệch?</text>

  <!-- [yes] → LEFT: flag + ghi nhận -->
  <line x1="439" y1="317" x2="310" y2="317" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="310" text-anchor="middle" font-size="10" font-family="Times New Roman">[yes]</text>
  <rect x="110" y="297" width="200" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="210" y="317" text-anchor="middle" font-size="10" font-family="Times New Roman">Đánh dấu vật tư chênh lệch</text>
  <text x="210" y="331" text-anchor="middle" font-size="10" font-family="Times New Roman">Yêu cầu nhập lý do điều chỉnh</text>

  <!-- U4: Nhập lý do -->
  <line x1="110" y1="317" x2="55" y2="317" stroke="#000" stroke-width="1.5"/>
  <line x1="55" y1="317" x2="55" y2="377" stroke="#000" stroke-width="1.5"/>
  <line x1="55" y1="377" x2="95" y2="377" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="95" y="358" width="215" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="202" y="382" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhập lý do điều chỉnh tồn kho</text>
  <!-- Merge back to system -->
  <line x1="310" y1="377" x2="398" y2="377" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- [no] → right to S3 -->
  <line x1="527" y1="345" x2="527" y2="377" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="365" font-size="10" font-family="Times New Roman">[no]</text>

  <!-- S3: Cập nhật tồn kho -->
  <rect x="400" y="358" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="382" text-anchor="middle" font-size="12" font-family="Times New Roman">Cập nhật SL tồn kho theo thực tế</text>
  <line x1="527" y1="396" x2="527" y2="415" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S4: Lưu biên bản -->
  <rect x="400" y="417" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="441" text-anchor="middle" font-size="12" font-family="Times New Roman">Lưu biên bản kiểm kê vào CSDL</text>
  <line x1="527" y1="455" x2="527" y2="474" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S5: Log -->
  <rect x="400" y="476" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="500" text-anchor="middle" font-size="12" font-family="Times New Roman">Ghi log hành động kiểm kê</text>
  <line x1="527" y1="514" x2="527" y2="533" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S6: Xuất báo cáo -->
  <rect x="400" y="535" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="559" text-anchor="middle" font-size="12" font-family="Times New Roman">Xuất báo cáo kiểm kê PDF / Excel</text>
  <line x1="527" y1="573" x2="527" y2="592" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S7: Thông báo -->
  <rect x="400" y="594" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="618" text-anchor="middle" font-size="12" font-family="Times New Roman">Thông báo "Kiểm kê hoàn tất"</text>
  <line x1="527" y1="632" x2="527" y2="651" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="527" cy="665" r="13" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="527" cy="665" r="8" fill="#000"/>
</svg>

<p style="text-align:center; font-style:italic; font-family:'Times New Roman'; font-size:13px; margin-top:4px;">
  Hình 2.t. Biểu đồ hoạt động use case Kiểm kê kho
</p>
</body>
</html>
