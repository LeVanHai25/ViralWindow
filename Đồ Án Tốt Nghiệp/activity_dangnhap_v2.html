<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Biểu đồ hoạt động – Đăng nhập</title>
  <style>
    body { margin: 0; background: #fff; font-family: "Times New Roman", serif; }
    svg { display: block; margin: 20px auto; }
  </style>
</head>
<body>
<svg width="720" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>

  <!-- OUTER BORDER -->
  <rect x="5" y="5" width="710" height="1070" fill="white" stroke="#000" stroke-width="1.5"/>

  <!-- SWIMLANE HEADERS -->
  <rect x="5" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <rect x="360" y="5" width="355" height="42" fill="white" stroke="#000" stroke-width="1"/>
  <text x="182" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Người dùng</text>
  <text x="537" y="31" text-anchor="middle" font-size="13" font-weight="bold" font-family="Times New Roman">Hệ thống</text>

  <!-- LANE DIVIDER -->
  <line x1="360" y1="47" x2="360" y2="1075" stroke="#000" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ═══ NODES ═══ -->

  <!-- START -->
  <circle cx="182" cy="78" r="13" fill="#000"/>
  <line x1="182" y1="91" x2="182" y2="110" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U1: Truy cập trang đăng nhập -->
  <rect x="55" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Truy cập trang đăng nhập</text>

  <!-- arrow U1 → S1 -->
  <line x1="310" y1="131" x2="398" y2="131" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S1: Hiển thị form -->
  <rect x="400" y="112" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="136" text-anchor="middle" font-size="12" font-family="Times New Roman">Hiển thị form đăng nhập</text>

  <!-- arrow S1 ↓ then ← to U2 -->
  <line x1="527" y1="150" x2="527" y2="172" stroke="#000" stroke-width="1.5"/>
  <line x1="527" y1="172" x2="310" y2="172" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U2: Nhập email và mật khẩu -->
  <rect x="55" y="175" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="199" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhập email và mật khẩu</text>
  <line x1="182" y1="213" x2="182" y2="232" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- U3: Nhấn Đăng nhập -->
  <rect x="55" y="234" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="182" y="258" text-anchor="middle" font-size="12" font-family="Times New Roman">Nhấn nút "Đăng nhập"</text>

  <!-- arrow U3 → S2 -->
  <line x1="310" y1="253" x2="398" y2="253" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S2: Validate dữ liệu -->
  <rect x="400" y="234" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="258" text-anchor="middle" font-size="12" font-family="Times New Roman">Kiểm tra định dạng dữ liệu</text>
  <line x1="527" y1="272" x2="527" y2="290" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D1: Dữ liệu hợp lệ? -->
  <polygon points="527,290 615,318 527,346 439,318" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="314" text-anchor="middle" font-size="11" font-family="Times New Roman">Dữ liệu</text>
  <text x="527" y="328" text-anchor="middle" font-size="11" font-family="Times New Roman">hợp lệ?</text>

  <!-- [invalid] → error → back to U2 -->
  <line x1="615" y1="318" x2="690" y2="318" stroke="#000" stroke-width="1.5"/>
  <text x="648" y="312" text-anchor="middle" font-size="10" font-family="Times New Roman">[invalid]</text>
  <line x1="690" y1="318" x2="690" y2="194" stroke="#000" stroke-width="1.5"/>
  <line x1="690" y1="194" x2="310" y2="194" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="645" y="210" text-anchor="middle" font-size="10" font-family="Times New Roman">[Hiển thị lỗi, nhập lại]</text>

  <!-- [valid] → down -->
  <line x1="527" y1="346" x2="527" y2="365" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="360" font-size="10" font-family="Times New Roman">[valid]</text>

  <!-- S3: Truy vấn DB -->
  <rect x="400" y="367" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="391" text-anchor="middle" font-size="12" font-family="Times New Roman">Truy vấn tài khoản theo email</text>
  <line x1="527" y1="405" x2="527" y2="424" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D2: Tài khoản tồn tại? -->
  <polygon points="527,424 615,452 527,480 439,452" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="448" text-anchor="middle" font-size="11" font-family="Times New Roman">Tài khoản</text>
  <text x="527" y="462" text-anchor="middle" font-size="11" font-family="Times New Roman">tồn tại?</text>

  <!-- [not found] → error → end LEFT -->
  <line x1="439" y1="452" x2="310" y2="452" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="445" text-anchor="middle" font-size="10" font-family="Times New Roman">[not found]</text>
  <rect x="150" y="432" width="160" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="230" y="452" text-anchor="middle" font-size="10" font-family="Times New Roman">Hiển thị lỗi:</text>
  <text x="230" y="466" text-anchor="middle" font-size="10" font-family="Times New Roman">"Tài khoản không tồn tại"</text>
  <line x1="150" y1="451" x2="100" y2="451" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="82" cy="451" r="10" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="451" r="6" fill="#000"/>

  <!-- [found] → down -->
  <line x1="527" y1="480" x2="527" y2="499" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="494" font-size="10" font-family="Times New Roman">[found]</text>

  <!-- S4: Kiểm tra fail count -->
  <rect x="400" y="501" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="525" text-anchor="middle" font-size="12" font-family="Times New Roman">Kiểm tra số lần đăng nhập sai</text>
  <line x1="527" y1="539" x2="527" y2="558" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D3: Fail >= 5? -->
  <polygon points="527,558 610,584 527,610 444,584" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="580" text-anchor="middle" font-size="11" font-family="Times New Roman">Fail count</text>
  <text x="527" y="594" text-anchor="middle" font-size="11" font-family="Times New Roman">≥ 5 lần?</text>

  <!-- [yes] → Khóa TK → error → end LEFT -->
  <line x1="444" y1="584" x2="310" y2="584" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="577" text-anchor="middle" font-size="10" font-family="Times New Roman">[yes]</text>
  <rect x="130" y="564" width="180" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="220" y="584" text-anchor="middle" font-size="10" font-family="Times New Roman">Khóa tài khoản &amp;</text>
  <text x="220" y="598" text-anchor="middle" font-size="10" font-family="Times New Roman">Hiển thị lỗi</text>
  <line x1="130" y1="583" x2="100" y2="583" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="82" cy="583" r="10" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="583" r="6" fill="#000"/>

  <!-- [no] → down -->
  <line x1="527" y1="610" x2="527" y2="629" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="624" font-size="10" font-family="Times New Roman">[no]</text>

  <!-- S5: So sánh mật khẩu -->
  <rect x="400" y="631" width="255" height="38" rx="19" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="655" text-anchor="middle" font-size="12" font-family="Times New Roman">So sánh mật khẩu (bcrypt)</text>
  <line x1="527" y1="669" x2="527" y2="688" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- D4: Mật khẩu đúng? -->
  <polygon points="527,688 615,716 527,744 439,716" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="712" text-anchor="middle" font-size="11" font-family="Times New Roman">Mật khẩu</text>
  <text x="527" y="726" text-anchor="middle" font-size="11" font-family="Times New Roman">đúng?</text>

  <!-- [wrong] → tăng fail + error → end LEFT -->
  <line x1="439" y1="716" x2="310" y2="716" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="372" y="709" text-anchor="middle" font-size="10" font-family="Times New Roman">[wrong]</text>
  <rect x="110" y="696" width="200" height="38" rx="8" fill="white" stroke="#000" stroke-width="1"/>
  <text x="210" y="716" text-anchor="middle" font-size="10" font-family="Times New Roman">Tăng fail +1, Hiển thị lỗi</text>
  <text x="210" y="730" text-anchor="middle" font-size="10" font-family="Times New Roman">"Sai mật khẩu"</text>
  <line x1="110" y1="715" x2="82" y2="715" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="82" cy="715" r="10" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="82" cy="715" r="6" fill="#000"/>

  <!-- [correct] → down -->
  <line x1="527" y1="744" x2="527" y2="763" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="758" font-size="10" font-family="Times New Roman">[correct]</text>

  <!-- S6: Reset fail count -->
  <rect x="400" y="765" width="255" height="36" rx="18" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="788" text-anchor="middle" font-size="12" font-family="Times New Roman">Reset fail count = 0</text>
  <line x1="527" y1="801" x2="527" y2="818" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S7: Tạo JWT Token -->
  <rect x="400" y="820" width="255" height="36" rx="18" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="843" text-anchor="middle" font-size="12" font-family="Times New Roman">Tạo JWT Token (id, role)</text>
  <line x1="527" y1="856" x2="527" y2="873" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S8: Ghi log -->
  <rect x="400" y="875" width="255" height="36" rx="18" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="898" text-anchor="middle" font-size="12" font-family="Times New Roman">Ghi log đăng nhập</text>
  <line x1="527" y1="911" x2="527" y2="928" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- S9: Điều hướng Dashboard -->
  <rect x="400" y="930" width="255" height="36" rx="18" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="527" y="953" text-anchor="middle" font-size="12" font-family="Times New Roman">Điều hướng Dashboard theo Role</text>
  <line x1="527" y1="966" x2="527" y2="984" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- END -->
  <circle cx="527" cy="998" r="13" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="527" cy="998" r="8" fill="#000"/>
</svg>

<p style="text-align:center; font-style:italic; font-family:'Times New Roman'; font-size:13px; margin-top:4px;">
  Hình 2.x. Biểu đồ hoạt động use case Đăng nhập
</p>
</body>
</html>
