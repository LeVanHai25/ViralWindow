<!DOCTYPE html>

<head>
  <meta charset="UTF-8"/>
  <title>Bảng CSDL Tiếng Việt – Nhóm 4</title>

</head>
<body>

<!-- BẢNG 9: GIAO DỊCH TÀI CHÍNH -->
<svg width="720" height="400" xmlns="http://www.w3.org/2000/svg">
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold">Bảng 2.9. GIAO_DICH_TAI_CHINH – Bảng phiếu thu chi</text>
  <rect x="20" y="35" width="680" height="30" fill="#d4a373" stroke="#a52a2a" stroke-width="1"/>
  <text x="45" y="55" font-size="11" font-weight="bold" fill="#fff">STT</text>
  <text x="85" y="55" font-size="11" font-weight="bold" fill="#fff">Tên trường</text>
  <text x="235" y="55" font-size="11" font-weight="bold" fill="#fff">Kiểu dữ liệu</text>
  <text x="385" y="55" font-size="11" font-weight="bold" fill="#fff">Ràng buộc</text>
  <text x="520" y="55" font-size="11" font-weight="bold" fill="#fff">Mô tả</text>
  <g font-size="11">
    <rect x="20" y="65" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="81">1</text><text x="85" y="81" font-weight="bold">ma_giao_dich</text><text x="235" y="81">INT</text><text x="385" y="81">Khóa chính, Tự tăng</text><text x="520" y="81">Mã giao dịch</text>
    <rect x="20" y="87" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="103">2</text><text x="85" y="103">ma_phieu</text><text x="235" y="103">VARCHAR(50)</text><text x="385" y="103">Bắt buộc, Duy nhất</text><text x="520" y="103">Mã phiếu thu/chi tự sinh</text>
    <rect x="20" y="109" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="125">3</text><text x="85" y="125">ngay_giao_dich</text><text x="235" y="125">DATE</text><text x="385" y="125">Bắt buộc</text><text x="520" y="125">Ngày phát sinh giao dịch</text>
    <rect x="20" y="131" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="147">4</text><text x="85" y="147">loai_giao_dich</text><text x="235" y="147">ENUM</text><text x="385" y="147">Bắt buộc</text><text x="520" y="147">Thu tiền / Chi tiền</text>
    <rect x="20" y="153" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="169">5</text><text x="85" y="169">danh_muc</text><text x="235" y="169">VARCHAR(100)</text><text x="385" y="169"></text><text x="520" y="169">Danh mục (Tiền cọc, Vật tư...)</text>
    <rect x="20" y="175" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="191">6</text><text x="85" y="191">loai_chi_phi</text><text x="235" y="191">VARCHAR(50)</text><text x="385" y="191"></text><text x="520" y="191">Vật tư/Nhân công/Vận chuyển</text>
    <rect x="20" y="197" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="213">7</text><text x="85" y="213">nha_cung_cap</text><text x="235" y="213">VARCHAR(255)</text><text x="385" y="213"></text><text x="520" y="213">Nhà cung cấp (nếu chi)</text>
    <rect x="20" y="219" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="235">8</text><text x="85" y="235">so_tien</text><text x="235" y="235">DECIMAL(15,2)</text><text x="385" y="235">Bắt buộc</text><text x="520" y="235">Số tiền giao dịch (VNĐ)</text>
    <rect x="20" y="241" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="257">9</text><text x="85" y="257">mo_ta</text><text x="235" y="257">TEXT</text><text x="385" y="257"></text><text x="520" y="257">Mô tả nội dung giao dịch</text>
    <rect x="20" y="263" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="279">10</text><text x="85" y="279">ma_du_an</text><text x="235" y="279">INT</text><text x="385" y="279">Khóa ngoại → DU_AN</text><text x="520" y="279">Dự án phát sinh</text>
    <rect x="20" y="285" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="301">11</text><text x="85" y="301">ma_khach_hang</text><text x="235" y="301">INT</text><text x="385" y="301">Khóa ngoại → KHACH_HANG</text><text x="520" y="301">Khách hàng liên quan</text>
    <rect x="20" y="307" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="323">12</text><text x="85" y="323">hinh_thuc_thanh_toan</text><text x="235" y="323">VARCHAR(50)</text><text x="385" y="323"></text><text x="520" y="323">Tiền mặt / Chuyển khoản</text>
    <rect x="20" y="329" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="345">13</text><text x="85" y="345">trang_thai</text><text x="235" y="345">ENUM</text><text x="385" y="345">Mặc định 'nhap'</text><text x="520" y="345">Nháp / Đã ghi sổ / Đã hủy</text>
    <rect x="20" y="351" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="367">14</text><text x="85" y="367">ngay_tao</text><text x="235" y="367">TIMESTAMP</text><text x="385" y="367">Tự động</text><text x="520" y="367">Ngày tạo phiếu</text>
    <rect x="20" y="373" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="389">15</text><text x="85" y="389">ngay_cap_nhat</text><text x="235" y="389">TIMESTAMP</text><text x="385" y="389">Tự cập nhật</text><text x="520" y="389">Ngày cập nhật</text>
  </g>
</svg>

<!-- BẢNG 10: THÔNG BÁO -->
<svg width="720" height="290" xmlns="http://www.w3.org/2000/svg">
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold">Bảng 2.10. THONG_BAO – Bảng thông báo hệ thống</text>
  <rect x="20" y="35" width="680" height="30" fill="#d4a373" stroke="#a52a2a" stroke-width="1"/>
  <text x="45" y="55" font-size="11" font-weight="bold" fill="#fff">STT</text>
  <text x="85" y="55" font-size="11" font-weight="bold" fill="#fff">Tên trường</text>
  <text x="235" y="55" font-size="11" font-weight="bold" fill="#fff">Kiểu dữ liệu</text>
  <text x="385" y="55" font-size="11" font-weight="bold" fill="#fff">Ràng buộc</text>
  <text x="520" y="55" font-size="11" font-weight="bold" fill="#fff">Mô tả</text>
  <g font-size="11">
    <rect x="20" y="65" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="81">1</text><text x="85" y="81" font-weight="bold">ma_thong_bao</text><text x="235" y="81">INT</text><text x="385" y="81">Khóa chính</text><text x="520" y="81">Mã thông báo</text>
    <rect x="20" y="87" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="103">2</text><text x="85" y="103">ma_nguoi_nhan</text><text x="235" y="103">INT</text><text x="385" y="103">Khóa ngoại → NGUOI_DUNG</text><text x="520" y="103">Người nhận thông báo</text>
    <rect x="20" y="109" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="125">3</text><text x="85" y="125">tieu_de</text><text x="235" y="125">VARCHAR(255)</text><text x="385" y="125">Bắt buộc</text><text x="520" y="125">Tiêu đề thông báo</text>
    <rect x="20" y="131" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="147">4</text><text x="85" y="147">noi_dung</text><text x="235" y="147">TEXT</text><text x="385" y="147">Bắt buộc</text><text x="520" y="147">Nội dung chi tiết</text>
    <rect x="20" y="153" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="169">5</text><text x="85" y="169">loai</text><text x="235" y="169">ENUM</text><text x="385" y="169">Mặc định 'thong_tin'</text><text x="520" y="169">Thông tin/Thành công/Cảnh báo</text>
    <rect x="20" y="175" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="191">6</text><text x="85" y="191">da_doc</text><text x="235" y="191">TINYINT(1)</text><text x="385" y="191">Mặc định 0</text><text x="520" y="191">0 = Chưa đọc, 1 = Đã đọc</text>
    <rect x="20" y="197" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="213">7</text><text x="85" y="213">loai_doi_tuong</text><text x="235" y="213">VARCHAR(50)</text><text x="385" y="213"></text><text x="520" y="213">Dự án/Báo giá/Kho...</text>
    <rect x="20" y="219" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="235">8</text><text x="85" y="235">ma_doi_tuong</text><text x="235" y="235">INT</text><text x="385" y="235"></text><text x="520" y="235">Mã đối tượng liên quan</text>
    <rect x="20" y="241" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="257">9</text><text x="85" y="257">muc_do</text><text x="235" y="257">ENUM</text><text x="385" y="257">Mặc định 'binh_thuong'</text><text x="520" y="257">Bình thường/Quan trọng/Khẩn</text>
    <rect x="20" y="263" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="279">10</text><text x="85" y="279">ngay_tao</text><text x="235" y="279">TIMESTAMP</text><text x="385" y="279">Tự động</text><text x="520" y="279">Thời điểm gửi thông báo</text>
  </g>
</svg>

<!-- BẢNG 11: NHẬT KÝ HOẠT ĐỘNG -->
<svg width="720" height="290" xmlns="http://www.w3.org/2000/svg">
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold">Bảng 2.11. NHAT_KY – Bảng nhật ký hoạt động</text>
  <rect x="20" y="35" width="680" height="30" fill="#d4a373" stroke="#a52a2a" stroke-width="1"/>
  <text x="45" y="55" font-size="11" font-weight="bold" fill="#fff">STT</text>
  <text x="85" y="55" font-size="11" font-weight="bold" fill="#fff">Tên trường</text>
  <text x="235" y="55" font-size="11" font-weight="bold" fill="#fff">Kiểu dữ liệu</text>
  <text x="385" y="55" font-size="11" font-weight="bold" fill="#fff">Ràng buộc</text>
  <text x="520" y="55" font-size="11" font-weight="bold" fill="#fff">Mô tả</text>
  <g font-size="11">
    <rect x="20" y="65" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="81">1</text><text x="85" y="81" font-weight="bold">ma_nhat_ky</text><text x="235" y="81">BIGINT</text><text x="385" y="81">Khóa chính, Tự tăng</text><text x="520" y="81">Mã nhật ký</text>
    <rect x="20" y="87" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="103">2</text><text x="85" y="103">ma_nguoi_dung</text><text x="235" y="103">INT</text><text x="385" y="103"></text><text x="520" y="103">Người thực hiện thao tác</text>
    <rect x="20" y="109" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="125">3</text><text x="85" y="125">ten_nguoi_dung</text><text x="235" y="125">VARCHAR(100)</text><text x="385" y="125"></text><text x="520" y="125">Tên người thực hiện</text>
    <rect x="20" y="131" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="147">4</text><text x="85" y="147">phuong_thuc</text><text x="235" y="147">VARCHAR(10)</text><text x="385" y="147">Bắt buộc</text><text x="520" y="147">GET / POST / PUT / DELETE</text>
    <rect x="20" y="153" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="169">5</text><text x="85" y="169">duong_dan</text><text x="235" y="169">VARCHAR(500)</text><text x="385" y="169">Bắt buộc</text><text x="520" y="169">Đường dẫn API được gọi</text>
    <rect x="20" y="175" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="191">6</text><text x="85" y="191">mo_ta_hanh_dong</text><text x="235" y="191">TEXT</text><text x="385" y="191"></text><text x="520" y="191">Mô tả hành động thực hiện</text>
    <rect x="20" y="197" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="213">7</text><text x="85" y="213">ma_trang_thai</text><text x="235" y="213">INT</text><text x="385" y="213"></text><text x="520" y="213">Mã HTTP (200, 404, 500...)</text>
    <rect x="20" y="219" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="235">8</text><text x="85" y="235">thoi_gian_xu_ly</text><text x="235" y="235">INT</text><text x="385" y="235"></text><text x="520" y="235">Thời gian xử lý (ms)</text>
    <rect x="20" y="241" width="680" height="22" fill="#fffbe6" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="257">9</text><text x="85" y="257">dia_chi_ip</text><text x="235" y="257">VARCHAR(45)</text><text x="385" y="257"></text><text x="520" y="257">Địa chỉ IP truy cập</text>
    <rect x="20" y="263" width="680" height="22" fill="#fff" stroke="#a52a2a" stroke-width="0.5"/>
    <text x="45" y="279">10</text><text x="85" y="279">thoi_diem</text><text x="235" y="279">TIMESTAMP</text><text x="385" y="279">Tự động</text><text x="520" y="279">Thời điểm ghi nhật ký</text>
  </g>
</svg>
